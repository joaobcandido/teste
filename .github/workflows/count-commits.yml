name: Contar Commits a partir do Manifest

on:
  push:
    branches: [ "main" ]

jobs:
  contar-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Essencial para baixar todo o histórico

      - name: Ler versão do arquivo manifest
        id: read_manifest
        run: |
          echo "=== Conteúdo do arquivo .manifest ==="
          cat .manifest
          echo "===================================="
          
          # Extrai a versão usando o jq para arquivos JSON
          VERSION=$(jq -r '.version' .manifest)
          
          echo "Versão extraída: '$VERSION'"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Contar commits a partir da versão
        run: |
          VERSION="${{ steps.read_manifest.outputs.version }}"
          
          # Conta os commits entre a tag/versão e o HEAD atual
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            TOTAL_COMMITS=$(git rev-list --count $VERSION..HEAD)
            echo "Número de commits desde a versão $VERSION: $TOTAL_COMMITS"
          else
            echo "Aviso: A versão '$VERSION' não foi encontrada como tag ou commit no Git. Contando todos os commits."
            TOTAL_COMMITS=$(git rev-list --count HEAD)
            echo "Total geral de commits: $TOTAL_COMMITS"
          fi
