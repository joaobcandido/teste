name: Contar Commits por Versão do Manifest

on:
  push:
    branches: [ "main" ]

jobs:
  contar-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identificar ponto de mudança da versão
        id: find_version_point
        run: |
          # 1. Lê a versão atual do arquivo .manifest
          CURRENT_VERSION=$(jq -r '.version' .manifest)
          echo "Versão atual no .manifest: $CURRENT_VERSION"
          
          # 2. Busca o commit mais recente onde o arquivo .manifest continha essa versão
          # Isso encontra o commit onde a versão atual foi introduzida ou alterada
          # grep -r procura o conteúdo, e rev-list encontra o primeiro commit com esse conteúdo
          
          # Encontra o hash do commit onde a versão atual apareceu pela primeira vez
          # Se não encontrar (versão nova), ele retorna o commit inicial
          VERSION_COMMIT=$(git log --reverse -S "\"version\": \"$CURRENT_VERSION\"" --format="%H" .manifest | head -n 1)
          
          if [ -z "$VERSION_COMMIT" ]; then
            echo "Primeira vez desta versão ou erro. Contando todos os commits."
            TOTAL_COMMITS=$(git rev-list --count HEAD)
          else
            echo "Versão $CURRENT_VERSION introduzida no commit: $VERSION_COMMIT"
            # Conta commits desde aquele commit até o presente
            TOTAL_COMMITS=$(git rev-list --count $VERSION_COMMIT..HEAD)
            # Adicionamos +1 para incluir o próprio commit onde a versão foi alterada
            TOTAL_COMMITS=$((TOTAL_COMMITS + 1))
          fi
          
          echo "total_commits=$TOTAL_COMMITS" >> $GITHUB_OUTPUT
          echo "Número de commits nesta versão: $TOTAL_COMMITS"
